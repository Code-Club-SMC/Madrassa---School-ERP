services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: msmis-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: msmis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msmis"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msmis-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/msmis"
      BETTER_AUTH_SECRET: "change-me"
      PORT: "3000"
      NODE_ENV: "production"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
