services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: msmis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: msmis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msmis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
